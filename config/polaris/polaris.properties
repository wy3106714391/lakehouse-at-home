# Polaris Catalog Configuration
# This file contains configuration for Apache Polaris Iceberg REST Catalog

# Server Configuration
quarkus.http.port=8100
quarkus.http.host=0.0.0.0

# Authentication - Simple mode for development
polaris.authentication.provider=simple
polaris.authentication.simple.principal=admin

# Storage Configuration - SeaweedFS S3
polaris.storage.credentials.s3.access-key=admin
polaris.storage.credentials.s3.secret-key=admin123
polaris.storage.credentials.s3.endpoint=http://seaweedfs:8333
polaris.storage.credentials.s3.path-style-access=true

# Database Configuration
quarkus.datasource.jdbc.url=jdbc:postgresql://postgres:5432/polaris_catalog
quarkus.datasource.username=admin
quarkus.datasource.password=admin123

# Catalog defaults
polaris.catalog.seed-catalogs=lakehouse

# Logging
quarkus.log.level=INFO
quarkus.log.category."org.apache.polaris".level=DEBUG

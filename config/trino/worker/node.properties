# Trino Worker Configuration

# Node properties
node.environment=production
node.id=worker1
node.data-dir=/data/trino

# Worker configuration
coordinator=false
http-server.http.port=8080

# Query configuration
query.max-memory=4GB
query.max-memory-per-node=2GB
query.max-total-memory-per-node=4GB

# Memory settings
task.max-memory=4GB

# Exchange data manager
exchange.data-manager.name=filesystem

# Catalog directory
catalog.config-dir=/etc/trino/catalog

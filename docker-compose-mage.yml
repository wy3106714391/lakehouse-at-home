x-mage-common:
  &mage-common
  build:
    context: .
    dockerfile: docker/mage/Dockerfile
  env_file: .env
  environment:
    &mage-common-env
    # Mage configuration
    ENV: production
    MAGE_CODE_PATH: /home/src
    MAGE_DATA_DIR: /opt/mage/data
    # Spark connection settings
    SPARK_MASTER_40: spark://localhost:7077
    SPARK_MASTER_41: spark://localhost:7078
    SPARK_HOME: /opt/spark
    # Kafka settings
    KAFKA_BOOTSTRAP_SERVERS: localhost:9092
    # S3/SeaweedFS settings (inherited from .env)
    AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
    AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    AWS_ENDPOINT_URL: ${S3_ENDPOINT}
    # PostgreSQL for metadata
    DB_CONNECTION_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:5432/mage_data
  volumes:
    - ./mage_projects:/home/src
    - ./logs/mage:/opt/mage/logs
    - ./scripts:/home/src/scripts
    - ./jars:/home/src/jars
    - ./data:/home/src/data
  network_mode: "host"
  depends_on:
    mage-init:
      condition: service_completed_successfully

services:
  mage-init:
    <<: *mage-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        echo "Initializing Mage.ai..."
        
        # Create Mage database if it doesn't exist
        PGPASSWORD=${POSTGRES_PASSWORD} psql -h localhost -U ${POSTGRES_USER} -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'mage_data'" | grep -q 1 || \
        PGPASSWORD=${POSTGRES_PASSWORD} psql -h localhost -U ${POSTGRES_USER} -d postgres -c "CREATE DATABASE mage_data"
        
        echo "Mage initialization complete"
    environment:
      <<: *mage-common-env
    depends_on: []
    restart: "no"

  mage-api:
    <<: *mage-common
    container_name: mage-api
    command: mage start /home/src
    ports:
      - "6789:6789"  # Mage UI
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:6789/api/v1/pipelines"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  mage-ui:
    <<: *mage-common
    container_name: mage-ui
    command: mage ui /home/src
    ports:
      - "6790:6790"  # Mage UI (alternative port)
    depends_on:
      - mage-api
    restart: unless-stopped
